name: Test pull request

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  indexer-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt', '**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        working-directory: indexer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: indexer
        run: |
          pytest tests

  build:
    runs-on: ubuntu-24.04
    env:
      CC: clang-20
      CXX: clang++-20

    steps:
    - name: Check out repository
      uses: actions/checkout@v3
      with:      
        submodules: 'recursive'
    
    - uses: actions/setup-go@v5
      with:
        go-version-file: ton-index-go/go.mod

    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang-20 git cmake ninja-build zlib1g-dev libcurl4-openssl-dev libsecp256k1-dev libmicrohttpd-dev libsodium-dev liblz4-dev libjemalloc-dev libhiredis-dev python3-yaml
#        wget https://apt.llvm.org/llvm.sh
#        chmod +x llvm.sh
#        sudo ./llvm.sh 16 all

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.x'

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20

    - name: Build C++ libraries
      run: touch suppression_mappings.txt && cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target ton-index-postgres ton-index-postgres-migrate ton-index-clickhouse ton-trace-emulator ton-trace-task-emulator ton-index-go ton-streaming-go ton-mch-engine classifier-failure-test task-emulator-with-actions-test test-ton-trace-processor ton-abi-test --parallel $(nproc)

    # The hermetic C++ gates, selected by name. CMake emits the production IR from
    # the tracked manifest/specs and compiles its tables into the engine;
    # mch_ir_equivalence byte-compares two independent build-tree emissions for
    # determinism. One step over the whole tree: the root CMakeLists.txt enables
    # testing, so every add_test() below is reachable here by name.
    - name: Test C++ gates
      run: ctest --test-dir ${{github.workspace}}/build -R 'mch_|classifier_failure|task_emulator_with_actions|ton_trace_processor|ton_abi_' --output-on-failure

    # The write-back wire contract, run through ton-index-go's REAL decoder
    # over the committed engine-produced payload_contract rows, which CI reads
    # but does not regenerate.
    - name: Test ton-index-go
      working-directory: ${{github.workspace}}/ton-index-go
      run: go test ./...

    # - name: Test
    #   working-directory: ${{github.workspace}}/build
    #   run: ./ton-index-worker/tondb-scanner/test-tondb
